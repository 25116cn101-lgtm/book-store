<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="content">

    <div class="box">

        <h2>Login</h2>

        <label>
            Email
        </label>

        <input
            type="email"
            placeholder="Enter your email"
        >


        <label>
            Password
        </label>

        <input
            type="password"
            placeholder="Enter your password"
        >


        <div class="options">

            <label class="check">
                <input type="checkbox">
                Remember me
            </label>

        </div>


        <div class="buttons">

            <button>
                Login
            </button>

        </div>

    </div>

</main>

</body>

</html>
