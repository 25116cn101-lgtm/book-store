<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Catalogue</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="content">

    <h2>Book Catalogue</h2>


    <div class="book-list">


        <div class="book">

            <img
                src="https://covers.openlibrary.org/b/isbn/9780735211292-L.jpg"
                alt="Atomic Habits"
            >

            <div class="book-info">

                <h3>Atomic Habits</h3>

                <p>
                    James Clear
                </p>

                <p class="price">
                    ₹499
                </p>

                <button>
                    Add to Cart
                </button>

            </div>

        </div>


        <div class="book">

            <img
                src="https://covers.openlibrary.org/b/isbn/9781612681139-L.jpg"
                alt="Rich Dad Poor Dad"
            >

            <div class="book-info">

                <h3>Rich Dad Poor Dad</h3>

                <p>
                    Robert Kiyosaki
                </p>

                <p class="price">
                    ₹399
                </p>

                <button>
                    Add to Cart
                </button>

            </div>

        </div>


        <div class="book">

            <img
                src="https://covers.openlibrary.org/b/isbn/9780857197689-L.jpg"
                alt="Psychology of Money"
            >

            <div class="book-info">

                <h3>
                    The Psychology of Money
                </h3>

                <p>
                    Morgan Housel
                </p>

                <p class="price">
                    ₹429
                </p>

                <button>
                    Add to Cart
                </button>

            </div>

        </div>


        <div class="book">

            <img
                src="https://covers.openlibrary.org/b/isbn/9781786330895-L.jpg"
                alt="Ikigai"
            >

            <div class="book-info">

                <h3>Ikigai</h3>

                <p>
                    Héctor García
                </p>

                <p class="price">
                    ₹349
                </p>

                <button>
                    Add to Cart
                </button>

            </div>

        </div>


    </div>

</main>


<footer>

    © 2026 Online Book Store

</footer>

</body>

</html>
