<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
    <div class="logo">LOGO</div>
    <div class="site">Online Book Store</div>
</div>

<div class="nav">
    <a href="home.html">Home</a>
    <a href="login.html">Login</a>
    <a href="registration.html">Registration</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="cart.html">Cart</a>
</div>

<div class="layout">

    <div class="sidebar">
        <a href="catalogue.html">CSE</a>
        <a href="catalogue.html">ECE</a>
        <a href="catalogue.html">EEE</a>
        <a href="catalogue.html">CIVIL</a>
    </div>

    <div class="content">
        <div class="box registration">

            <h2>Registration Page</h2>

            <label>Name</label>
            <input type="text">

            <label>Password</label>
            <input type="password">

            <label>E-mail</label>
            <input type="email">

            <label>Phone Number</label>
            <input type="text">

            <label>Sex</label>
            <div class="options">
                <input type="radio" name="sex"> Male
                <input type="radio" name="sex"> Female
            </div>

            <label>Date of Birth</label>
            <div class="dob">
                <select>
                    <option>Day</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select>

                <select>
                    <option>Month</option>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                </select>

                <select>
                    <option>Year</option>
                    <option>2000</option>
                    <option>2001</option>
                    <option>2002</option>
                </select>
            </div>


            <div class="buttons">
                <button>Register</button>
                <button type="reset">Reset</button>
            </div>

        </div>
    </div>

</div>

</body>
</html>
