<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Registration</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="content">

    <div class="box">

        <h2>Create Account</h2>


        <label>
            Full Name
        </label>

        <input
            type="text"
            placeholder="Enter your name"
        >


        <label>
            Email
        </label>

        <input
            type="email"
            placeholder="Enter your email"
        >


        <label>
            Password
        </label>

        <input
            type="password"
            placeholder="Create password"
        >


        <label>
            Date of Birth
        </label>

        <div class="dob">

            <select>
                <option>Day</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
            </select>

            <select>
                <option>Month</option>
                <option>January</option>
                <option>February</option>
                <option>March</option>
            </select>

            <select>
                <option>Year</option>
                <option>2005</option>
                <option>2006</option>
                <option>2007</option>
                <option>2008</option>
            </select>

        </div>


        <div class="buttons">

            <button>
                Register
            </button>

            <button type="reset">
                Reset
            </button>

        </div>

    </div>

</main>

</body>

</html>
