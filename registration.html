<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>

<body>

    <h2>Registration Form</h2>

    <form>

        <!-- Name -->
        <label>Name:</label>
        <input type="text" name="name">

        <br><br>


        <!-- Password -->
        <label>Password:</label>
        <input type="password" name="password">

        <br><br>


        <!-- Email -->
        <label>E-mail:</label>
        <input type="email" name="email">

        <br><br>


        <!-- Phone -->
        <label>Phone Number:</label>
        <input type="text" name="phone">

        <br><br>


        <!-- Sex -->
        <label>Sex:</label>

        <input type="radio" name="sex" value="Male">
        Male

        <input type="radio" name="sex" value="Female">
        Female

        <br><br>


        <!-- Date of Birth -->
        <label>Date of Birth:</label>

        <select name="day">
            <option>Day</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
            <option>15</option>
            <option>16</option>
            <option>17</option>
            <option>18</option>
            <option>19</option>
            <option>20</option>
            <option>21</option>
            <option>22</option>
            <option>23</option>
            <option>24</option>
            <option>25</option>
            <option>26</option>
            <option>27</option>
            <option>28</option>
            <option>29</option>
            <option>30</option>
            <option>31</option>
        </select>


        <select name="month">
            <option>Month</option>
            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
            <option>May</option>
            <option>June</option>
            <option>July</option>
            <option>August</option>
            <option>September</option>
            <option>October</option>
            <option>November</option>
            <option>December</option>
        </select>


        <select name="year">
            <option>Year</option>
            <option>2000</option>
            <option>2001</option>
            <option>2002</option>
            <option>2003</option>
            <option>2004</option>
            <option>2005</option>
            <option>2006</option>
            <option>2007</option>
            <option>2008</option>
            <option>2009</option>
            <option>2010</option>
        </select>

        <br><br>


        <!-- Languages -->
        <label>Languages Known:</label>

        <input type="checkbox" name="language" value="English">
        English

        <input type="checkbox" name="language" value="Hindi">
        Hindi

        <input type="checkbox" name="language" value="Telugu">
        Telugu

        <input type="checkbox" name="language" value="Tamil">
        Tamil

        <br><br>


        <!-- Address -->
        <label>Address:</label>

        <br>

        <textarea name="address" rows="5" cols="40"></textarea>

        <br><br>


        <input type="submit" value="Register">

        <input type="reset" value="Reset">

    </form>

</body>

</html>
