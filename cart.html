<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
</head>

<body>

    <h2>Shopping Cart</h2>

    <table border="1" cellpadding="10" cellspacing="0">

        <tr>
            <th>Book Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Amount</th>
        </tr>


        <tr>
            <td>Java 2</td>
            <td>$35.5</td>
            <td>2</td>
            <td>$71</td>
        </tr>


        <tr>
            <td>XML Bible</td>
            <td>$40.5</td>
            <td>1</td>
            <td>$40.5</td>
        </tr>


        <tr>
            <td colspan="3">
                <b>Total Amount</b>
            </td>

            <td>
                <b>$111.5</b>
            </td>
        </tr>

    </table>

</body>

</html>
