
<link rel="stylesheet" href="style.css">
<div class="content">
<h2>Shopping Cart</h2>
<div id="cart"></div>
<h3 id="total"></h3>
<button onclick="localStorage.removeItem('cart');location.reload()">Clear Cart</button>
<script>
let c=JSON.parse(localStorage.cart||"[]"),sum=0;
c.forEach((b,i)=>{
sum+=Number(b[2]);
cart.innerHTML+=`<div class="book">
<img src="${b[3].startsWith('http')?b[3]:'https://images.unsplash.com/photo-'+b[3]+'?w=200'}" alt="Book cover">
<div><h3>${b[0]}</h3><p>₹${b[2]}</p>
<button onclick="removeBook(${i})">Remove</button></div></div>`;
});
total.innerText="Total: ₹"+sum;
if(!c.length)cart.innerHTML="Your cart is empty.";
function removeBook(i){
c.splice(i,1);localStorage.cart=JSON.stringify(c);location.reload();
}
</script>
</div>
